services:
  # ---------------------------------------------------------------
  # PostgreSQL Vector Database (with pgvector extension)
  # ---------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      # Persistent vector database storage on host
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # Spring Boot RAG Application
  # ---------------------------------------------------------------
  app:
    build:
      context: ./document-rag/document-rag
      dockerfile: Dockerfile
    container_name: rag-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database connection
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA: "true"
      SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSIONS: "768"
      SPRING_AI_VECTORSTORE_PGVECTOR_DISTANCE_TYPE: "COSINE_DISTANCE"
      SPRING_AI_RETRY_MAX_ATTEMPTS: ${SPRING_AI_RETRY_MAX_ATTEMPTS:-2}
      SPRING_AI_RETRY_BACKOFF_INITIAL_INTERVAL: ${SPRING_AI_RETRY_INITIAL_INTERVAL:-500ms}
      SPRING_AI_RETRY_BACKOFF_MULTIPLIER: ${SPRING_AI_RETRY_MULTIPLIER:-2}
      SPRING_AI_RETRY_BACKOFF_MAX_INTERVAL: ${SPRING_AI_RETRY_MAX_INTERVAL:-2s}
      # Disable the optional second LLM call that polishes each answer.
      APP_RAG_REFINER_ENABLED: ${APP_RAG_REFINER_ENABLED:-false}

      # Google Gemini (Primary Preference)
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${GEMINI_API_KEY:-dummy}
      SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-512}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dummy}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-512}

      # Ollama / Qwen (Automatic Fallback on Token/Quota Limit)
      SPRING_AI_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SPRING_AI_OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b-instruct}
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b-instruct}
      SPRING_AI_OLLAMA_CHAT_OPTIONS_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b-instruct}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # Allows the container to communicate with services on host machine (like host-installed Ollama)
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
    driver: local
