spring.application.name=document-rag

# -----------------------------------------------------------------
# Google Gemini (Primary Preference)
# -----------------------------------------------------------------
spring.ai.google.genai.api-key=${GEMINI_API_KEY:dummy}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.options.temperature=0.3
spring.ai.google.genai.embedding.model=gemini-embedding-001

# -----------------------------------------------------------------
# Ollama / Qwen (Automatic Fallback on Token/Quota Limit)
# -----------------------------------------------------------------
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:qwen2.5:3b-instruct}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen2.5:3b-instruct}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# -----------------------------------------------------------------
# PostgreSQL & PGVector
# -----------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# -----------------------------------------------------------------
# RAG Response Refiner (Stage-2 Human-Readability Polishing)
# -----------------------------------------------------------------
app.rag.refiner.enabled=${APP_RAG_REFINER_ENABLED:true}