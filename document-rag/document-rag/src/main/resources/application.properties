spring.application.name=document-rag

# Google Gemini (Google GenAI) Cloud API Configuration
# Get your API key from Google AI Studio: https://aistudio.google.com/
spring.ai.google.genai.api-key=${GEMINI_API_KEY:dummy}

# -----------------------------------------------------------------
# Provider selection: set to 'gemini' or 'ollama'
# -----------------------------------------------------------------
ai.provider=ollama

# When using Ollama: activate Ollama chat + embedding auto-config
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

# Ollama settings
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:3b-instruct
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Gemini settings (uncomment and set ai.provider=gemini to switch back)
# spring.ai.model.chat=google-genai
# spring.ai.model.embedding=google-genai
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.chat.options.temperature=0.3

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# PGvector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE